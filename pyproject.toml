[project]
name = "message-triage"
version = "0.1.0"
description = "Inbound customer message triage for GAJAN Group brands"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.11",
    "google-genai>=2.28.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
